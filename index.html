<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كتالوج عطارة المحبة والإيمان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --green:#1e7a34;--dgreen:#145227;--gold:#c8a020;--lgold:#ffd700;
  --bg:#f5f5f0;--card:#fff;--red:#d32f2f;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);min-height:100vh;}

.header{
  background:linear-gradient(135deg,var(--dgreen),var(--green));
  padding:18px 16px 14px;text-align:center;position:sticky;top:0;z-index:100;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.gold-line{height:4px;background:linear-gradient(90deg,transparent,var(--lgold),transparent);margin-bottom:10px;}
.store-name{font-size:22px;font-weight:900;color:#fff;margin-bottom:3px;}
.store-sub{font-size:12px;color:rgba(255,255,255,.8);margin-bottom:10px;}
.header-btns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.hbtn{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:6px 13px;border-radius:20px;font-size:11px;
  font-weight:700;text-decoration:none;font-family:'Cairo',sans-serif;
}
.hbtn-refresh{background:rgba(255,214,0,.25);border-color:rgba(255,214,0,.5);cursor:pointer;border:none;}

.search-bar{padding:12px 16px;background:#fff;border-bottom:1px solid #e8e8e8;}
.search-input{
  width:100%;padding:9px 16px;border:2px solid #e0e0e0;border-radius:25px;
  font-size:14px;font-family:'Cairo',sans-serif;outline:none;
}
.search-input:focus{border-color:var(--green);}

.cats-nav{
  display:flex;gap:8px;padding:10px 16px;overflow-x:auto;
  background:#fff;border-bottom:2px solid #f0f0f0;scrollbar-width:none;
}
.cats-nav::-webkit-scrollbar{display:none;}
.cat-btn{
  background:#f0f0f0;border:none;padding:7px 14px;border-radius:20px;
  font-size:12px;font-weight:700;font-family:'Cairo',sans-serif;
  cursor:pointer;white-space:nowrap;color:#444;transition:all .2s;
}
.cat-btn.active,.cat-btn:hover{background:var(--green);color:#fff;}

main{padding:16px;max-width:600px;margin:0 auto;}
.section{margin-bottom:24px;display:none;}
.section.visible{display:block;}
.section-title{
  font-size:16px;font-weight:900;color:var(--dgreen);
  margin-bottom:12px;padding-bottom:6px;
  border-bottom:3px solid var(--gold);
}
.products-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.product-card{
  background:var(--card);border-radius:14px;padding:13px 11px;
  box-shadow:0 2px 10px rgba(0,0,0,.07);border:1.5px solid #e8e8e8;
  display:flex;flex-direction:column;gap:5px;position:relative;
}
.offer-tag{
  position:absolute;top:8px;left:8px;
  background:var(--red);color:#fff;font-size:10px;font-weight:900;
  padding:3px 8px;border-radius:10px;font-family:'Cairo',sans-serif;
}
.p-icon{font-size:28px;text-align:center;margin-bottom:2px;}
.p-name{font-size:13px;font-weight:900;color:var(--dgreen);text-align:center;line-height:1.3;}
.p-size{font-size:11px;color:#888;text-align:center;}
.p-old{font-size:11px;color:#aaa;text-decoration:line-through;text-align:center;}
.p-price{
  background:var(--green);color:#fff;font-size:15px;font-weight:900;
  text-align:center;padding:5px 8px;border-radius:8px;
}
.p-price.offer{background:var(--red);}
.order-btn{
  background:#25D366;color:#fff;border:none;padding:7px;
  border-radius:8px;font-size:12px;font-weight:700;
  font-family:'Cairo',sans-serif;cursor:pointer;text-decoration:none;
  display:block;text-align:center;margin-top:2px;
}

.w-card{
  background:linear-gradient(135deg,#fff9e6,#fffbe8);
  border:2px solid var(--gold);border-radius:14px;padding:13px;
  margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;
}
.w-name{font-size:14px;font-weight:900;color:var(--dgreen);}
.w-size{font-size:11px;color:#888;}
.w-price{font-size:20px;font-weight:900;color:var(--gold);}

/* LOADING */
.loading{
  text-align:center;padding:60px 20px;
}
.spinner{
  width:48px;height:48px;border:5px solid #e0e0e0;
  border-top-color:var(--green);border-radius:50%;
  animation:spin 1s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:15px;color:#666;font-weight:700;}

.error-box{
  background:#fff3f3;border:2px solid #ffcdd2;border-radius:14px;
  padding:20px;text-align:center;margin:20px;
}
.error-title{font-size:16px;font-weight:900;color:var(--red);margin-bottom:8px;}
.error-sub{font-size:13px;color:#666;}

.footer{
  background:var(--dgreen);color:#fff;text-align:center;
  padding:20px 16px;margin-top:10px;
}
.footer-name{font-size:17px;font-weight:900;margin-bottom:5px;}
.footer-addr{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:12px;}
.footer-wa{
  display:inline-block;background:#25D366;color:#fff;
  padding:10px 24px;border-radius:25px;font-size:14px;font-weight:900;
  text-decoration:none;font-family:'Cairo',sans-serif;
}
.no-results{text-align:center;padding:40px;color:#888;font-size:14px;display:none;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1e7a34;color:#fff;padding:12px 24px;border-radius:25px;
  font-size:14px;font-weight:700;font-family:'Cairo',sans-serif;
  z-index:99999;transition:transform .3s;pointer-events:none;
  box-shadow:0 6px 20px rgba(0,0,0,.3);
}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="header">
  <div class="gold-line"></div>
  <div class="store-name">🌿 عطارة المحبة والإيمان</div>
  <div class="store-sub">✦ أفضل الأسعار — أعلى الجودة — توصيل لباب البيت ✦</div>
  <div class="header-btns">
    <a class="hbtn" href="tel:01140950468">📞 اتصل</a>
    <a class="hbtn" href="https://wa.me/201140950468">💬 واتساب</a>
    <a class="hbtn" href="https://chat.whatsapp.com/Cju1sUivtxhB60I5zV8P58">👥 الجروب</a>
    <button class="hbtn hbtn-refresh" onclick="loadFromSheets()">🔄 تحديث</button>
  </div>
</div>

<div class="search-bar">
  <input class="search-input" type="text" placeholder="🔍 ابحث عن منتج..." id="searchInput" oninput="filterProducts()">
</div>

<div class="cats-nav" id="catsNav">
  <button class="cat-btn active" onclick="showCat('all',this)">🛒 الكل</button>
</div>

<main id="catalogMain">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-text">جاري تحميل المنتجات...</div>
  </div>
</main>

<div class="no-results" id="noResults">😔 مفيش نتايج للبحث ده</div>

<div class="footer">
  <div class="footer-name">🌿 عطارة المحبة والإيمان</div>
  <div class="footer-addr">📍 شارع عشرة — جانب مكتب الإسكندرية</div>
  <a class="footer-wa" href="https://wa.me/201140950468">💬 اطلب على واتساب</a>
</div>

<div class="toast" id="toast"></div>

<script>
const SHEET_ID = '1IuCSs5ZXRk2WBRU-KtZ8tBu-1Or3P3kWmc3MEkVErIo';
const WA = '201140950468';
// Try multiple API methods
const API_URL_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
const API_URL_JSON = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

const CATS_MAP = {
  'سمن وزيت':  {key:'ghee',  icon:'🫙'},
  'أرز':        {key:'rice',  icon:'🌾'},
  'مكرونة':    {key:'pasta', icon:'🍝'},
  'مكرونه':    {key:'pasta', icon:'🍝'},
  'ألبان وبقالة':{key:'dairy',icon:'🥛'},
  'البان وبقاله':{key:'dairy',icon:'🥛'},
  'مشروبات':   {key:'drinks',icon:'☕'},
  'بقوليات':   {key:'legumes',icon:'🫘'},
  'بقوليه':    {key:'legumes',icon:'🫘'},
  'جملة':      {key:'wholesale',icon:'📦'},
  'جمله':      {key:'wholesale',icon:'📦'},
};

let products = [];
let currentCat = 'all';

async function loadFromSheets() {
  document.getElementById('catalogMain').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">جاري تحميل المنتجات...</div>
    </div>`;

  try {
    // Try JSON method first (more reliable)
    let parsed = null;
    try {
      const res = await fetch(API_URL_JSON + '&cb=' + Date.now());
      const text = await res.text();
      // Google returns: google.visualization.Query.setResponse({...})
      const jsonStr = text.replace(/^[^(]+\(/, '').replace(/\);?\s*$/, '');
      const data = JSON.parse(jsonStr);
      parsed = parseGVizJSON(data);
    } catch(e1) {
      // Fallback to CSV
      const res = await fetch(API_URL_CSV + '&cb=' + Date.now());
      if(!res.ok) throw new Error('fetch failed');
      const csv = await res.text();
      parsed = parseCSV(csv);
    }

    if(!parsed || parsed.length === 0) throw new Error('no data');
    products = parsed;
    buildCatsNav();
    renderCatalog();
    showToast('✅ تم تحديث الأسعار');
  } catch(e) {
    document.getElementById('catalogMain').innerHTML = `
      <div class="error-box">
        <div class="error-title">⚠️ تعذر تحميل البيانات</div>
        <div class="error-sub">تأكد إن الشيت مشارك للعموم<br>ثم اضغط 🔄 تحديث<br><small style="color:#999">${e.message}</small></div>
      </div>`;
  }
}

function parseGVizJSON(data) {
  if(!data || !data.table) return [];
  const cols = data.table.cols;
  const rows = data.table.rows;
  if(!rows) return [];
  return rows.map((row, idx) => {
    const get = (i) => (row.c && row.c[i] && row.c[i].v != null) ? String(row.c[i].v) : '';
    return {
      id: idx+1,
      name:     get(0),
      size:     get(1),
      price:    parseFloat(get(2))||0,
      oldprice: parseFloat(get(3))||0,
      cat:      get(4)||'بقوليات',
      icon:     get(5)||'🛒',
      offer:    get(6)||'',
    };
  }).filter(p => p.name && p.price);
}

function parseCSV(csv) {
  const lines = csv.trim().split('\n');
  // skip header row
  const rows = lines.slice(1);
  return rows.map((line, idx) => {
    // handle quoted fields
    const cols = [];
    let cur = '', inQ = false;
    for(let c of line) {
      if(c==='"') { inQ=!inQ; }
      else if(c===',' && !inQ) { cols.push(cur.trim()); cur=''; }
      else cur += c;
    }
    cols.push(cur.trim());

    // Columns: الاسم, الحجم, السعر, السعر القديم, القسم, الأيقونة, عرض
    return {
      id: idx+1,
      name:     cols[0]||'',
      size:     cols[1]||'',
      price:    parseFloat(cols[2])||0,
      oldprice: parseFloat(cols[3])||0,
      cat:      cols[4]||'بقوليات',
      icon:     cols[5]||'🛒',
      offer:    cols[6]||'',
    };
  }).filter(p => p.name && p.price);
}

function buildCatsNav() {
  const usedCats = [...new Set(products.map(p=>p.cat))];
  const nav = document.getElementById('catsNav');
  nav.innerHTML = `<button class="cat-btn active" onclick="showCat('all',this)">🛒 الكل</button>`;
  usedCats.forEach(cat => {
    const info = CATS_MAP[cat] || {icon:'📦'};
    nav.innerHTML += `<button class="cat-btn" onclick="showCat('${cat}',this)">${info.icon} ${cat}</button>`;
  });
}

function renderCatalog() {
  const usedCats = [...new Set(products.map(p=>p.cat))];
  let html = '';

  usedCats.forEach(cat => {
    const items = products.filter(p=>p.cat===cat);
    if(!items.length) return;
    const visible = (currentCat==='all' || currentCat===cat) ? ' visible' : '';
    const info = CATS_MAP[cat] || {icon:'📦'};

    if(cat==='جملة') {
      html += `<div class="section${visible}" id="sec-${cat}">
        <div class="section-title">${info.icon} ${cat}</div>`;
      items.forEach(p => {
        html += `<div class="w-card">
          <div><div class="w-name">${p.icon} ${p.name}</div>
          <div class="w-size">${p.size}</div></div>
          <div class="w-price">${p.price} <span style="font-size:12px">ج</span></div>
        </div>`;
      });
      html += `<a class="order-btn" style="padding:13px;font-size:14px;"
        href="https://wa.me/${WA}?text=عايز أعرف عروض الجملة">📞 تواصل للجملة</a></div>`;
    } else {
      html += `<div class="section${visible}" id="sec-${cat}">
        <div class="section-title">${info.icon} ${cat}</div>
        <div class="products-grid">`;
      items.forEach(p => {
        const offerTag = p.offer ? `<div class="offer-tag">${p.offer}</div>` : '';
        const oldHtml = p.oldprice ? `<div class="p-old">${p.oldprice} ج</div>` : '';
        const cls = p.offer ? 'p-price offer' : 'p-price';
        html += `<div class="product-card" data-name="${p.name} ${p.size}">
          ${offerTag}
          <div class="p-icon">${p.icon}</div>
          <div class="p-name">${p.name}</div>
          <div class="p-size">${p.size}</div>
          ${oldHtml}
          <div class="${cls}">${p.price} <span style="font-size:11px;opacity:.8">ج</span></div>
          <a class="order-btn" href="https://wa.me/${WA}?text=${encodeURIComponent('عايز أطلب '+p.name+' '+p.size)}">💬 اطلب دلوقتي</a>
        </div>`;
      });
      html += `</div></div>`;
    }
  });

  document.getElementById('catalogMain').innerHTML = html || '<div style="text-align:center;padding:40px;color:#888">لا توجد منتجات</div>';
}

function showCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('searchInput').value='';
  document.getElementById('noResults').style.display='none';
  renderCatalog();
}

function filterProducts() {
  const q = document.getElementById('searchInput').value.trim();
  if(!q) { currentCat='all'; renderCatalog(); document.getElementById('noResults').style.display='none'; return; }
  currentCat='all'; renderCatalog();
  const cards = document.querySelectorAll('.product-card');
  let found=0;
  cards.forEach(c=>{
    if((c.dataset.name||'').includes(q)){c.style.display='flex';found++;}
    else c.style.display='none';
  });
  document.querySelectorAll('.section').forEach(s=>{
    const vis=Array.from(s.querySelectorAll('.product-card')).some(c=>c.style.display!=='none');
    vis ? s.classList.add('visible') : s.classList.remove('visible');
  });
  document.getElementById('noResults').style.display = found===0?'block':'none';
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

loadFromSheets();
</script>
</body>
</html
