<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المبه - ALMABBEH</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-emerald-600 text-white shadow-md py-4 px-6 mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">🛒 متجر المبه (ALMABBEH)</h1>
            <span class="bg-emerald-700 text-sm px-3 py-1 rounded-full">الوضع المباشر</span>
        </div>
    </header>

    <main class="container mx-auto px-4 pb-12">
        <h2 class="text-xl font-semibold mb-6 text-gray-700">قائمة المنتجات والأسعار:</h2>
        
        <div id="loading" class="text-center py-10 text-gray-500 text-lg">جاري تحميل المنتجات...</div>
        
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <script>
        const SUPABASE_URL = 'https://altqqwqhtjfrsfdmszbr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsdHFxd3FodGpmcnNmZG1zemJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2NTU2MzksImV4cCI6MjA3MDIzMTYzOX0.dummy_key_placeholder';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchProducts() {
            const grid = document.getElementById('products-grid');
            const loading = document.getElementById('loading');

            try {
                const { data, error } = await _supabase.from('products').select('*');
                if (error) throw error;

                loading.style.display = 'none';

                if (!data || data.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center text-gray-500">لا توجد منتجات مضافة حالياً.</p>';
                    return;
                }

                grid.innerHTML = data.map(product => {
                    const imageUrl = product.image ? product.image : 'https://via.placeholder.com/300?text=ALMABBEH';
                    return `
                        <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col justify-between">
                            <div>
                                <div class="h-48 overflow-hidden bg-gray-100 flex items-center justify-center">
                                    <img src="${imageUrl}" alt="${product.name}" class="w-full h-full object-cover">
                                </div>
                                <div class="p-4">
                                    <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">${product.category || 'عام'}</span>
                                    <h3 class="text-lg font-bold mt-2 text-gray-800">${product.name || 'منتج'}</h3>
                                </div>
                            </div>
                            <div class="p-4 pt-0 flex justify-between items-center mt-2">
                                <span class="text-emerald-600 font-bold text-xl">${product.price ? product.price + ' جنيه' : 'السعر غير متوفر'}</span>
                                <button onclick="alert('تمت إضافة ${product.name} إلى السلة!')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">أضف للسلة</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error(error);
                loading.innerHTML = '<p class="text-red-500">حدث خطأ في تحميل المنتجات.</p>';
            }
        }

        fetchProducts();
    </script>
</body>
</html>
