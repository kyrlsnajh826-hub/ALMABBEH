<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المبه - ALMABBEH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-emerald-600 text-white shadow-md py-4 px-6 mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">🛒 متجر المبه (ALMABBEH)</h1>
            <span class="bg-emerald-700 text-sm px-3 py-1 rounded-full">الوضع المباشر</span>
        </div>
    </header>

    <main class="container mx-auto px-4 pb-12">
        <h2 class="text-xl font-semibold mb-6 text-gray-700">قائمة المنتجات والأسعار:</h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            
            <!-- 1. المنتج الأول (عدل الاسم، السعر، ورابط الصورة براحتك) -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col justify-between">
                <div>
                    <div class="w-full h-48 bg-gray-200">
                        <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=500&q=80" alt="اسم المنتج" class="w-full h-48 object-cover">
                    </div>
                    <div class="p-4">
                        <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">القسم</span>
                        <h3 class="text-lg font-bold mt-2 text-gray-800">اسم المنتج هنا</h3>
                    </div>
                </div>
                <div class="p-4 pt-0 flex justify-between items-center mt-2">
                    <span class="text-emerald-600 font-bold text-xl">السعر جنيه</span>
                    <button class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">أضف للسلة</button>
                </div>
            </div>

            <!-- تقدر تنسخ الكارت اللي فوق وتكرره لأي منتج جديد تلاقيه -->

        </div>
    </main>
</body>
</html>
