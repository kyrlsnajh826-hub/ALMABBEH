<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المبه - ALMABBEH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-emerald-600 text-white shadow-md py-4 px-6 mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">🛒 متجر المبه (ALMABBEH)</h1>
            <span class="bg-emerald-700 text-sm px-3 py-1 rounded-full">الوضع المباشر</span>
        </div>
    </header>

    <main class="container mx-auto px-4 pb-12">
        <h2 class="text-xl font-semibold mb-6 text-gray-700">قائمة المنتجات والأسعار المتوفرة:</h2>
        
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- المنتجات الجاهزة -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col justify-between">
                <div>
                    <div class="h-48 overflow-hidden bg-gray-100 flex items-center justify-center">
                        <img src="https://via.placeholder.com/300?text=أرز" alt="أرز" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4">
                        <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">حبوب</span>
                        <h3 class="text-lg font-bold mt-2 text-gray-800">أرز</h3>
                    </div>
                </div>
                <div class="p-4 pt-0 flex justify-between items-center mt-2">
                    <span class="text-emerald-600 font-bold text-xl">25 جنيه</span>
                    <button onclick="alert('تمت إضافة أرز إلى السلة!')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">أضف للسلة</button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col justify-between">
                <div>
                    <div class="h-48 overflow-hidden bg-gray-100 flex items-center justify-center">
                        <img src="https://via.placeholder.com/300?text=زيت+حلو" alt="زيت حلو" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4">
                        <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">زيوت</span>
                        <h3 class="text-lg font-bold mt-2 text-gray-800">زيت حلو 1 بروف</h3>
                    </div>
                </div>
                <div class="p-4 pt-0 flex justify-between items-center mt-2">
                    <span class="text-emerald-600 font-bold text-xl">45 جنيه</span>
                    <button onclick="alert('تمت إضافة زيت حلو إلى السلة!')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">أضف للسلة</button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col justify-between">
                <div>
                    <div class="h-48 overflow-hidden bg-gray-100 flex items-center justify-center">
                        <img src="https://via.placeholder.com/300?text=مكرونة" alt="مكرونة" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4">
                        <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">نشويات</span>
                        <h3 class="text-lg font-bold mt-2 text-gray-800">مكرونة</h3>
                    </div>
                </div>
                <div class="p-4 pt-0 flex justify-between items-center mt-2">
                    <span class="text-emerald-600 font-bold text-xl">15 جنيه</span>
                    <button onclick="alert('تمت إضافة مكرونة إلى السلة!')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">أضف للسلة</button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col justify-between">
                <div>
                    <div class="h-48 overflow-hidden bg-gray-100 flex items-center justify-center">
                        <img src="https://via.placeholder.com/300?text=شاي+العروسة" alt="شاي العروسة" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4">
                        <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">مشروبات</span>
                        <h3 class="text-lg font-bold mt-2 text-gray-800">شاي العروسة 250 جم</h3>
                    </div>
                </div>
                <div class="p-4 pt-0 flex justify-between items-center mt-2">
                    <span class="text-emerald-600 font-bold text-xl">35 جنيه</span>
                    <button onclick="alert('تمت إضافة شاي العروسة إلى السلة!')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">أضف للسلة</button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col justify-between">
                <div>
                    <div class="h-48 overflow-hidden bg-gray-100 flex items-center justify-center">
                        <img src="https://via.placeholder.com/300?text=سمن+جنة" alt="سمن جنة" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4">
                        <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">دهون ولبنيات</span>
                        <h3 class="text-lg font-bold mt-2 text-gray-800">سمن جنة 1.5 كج</h3>
                    </div>
                </div>
                <div class="p-4 pt-0 flex justify-between items-center mt-2">
                    <span class="text-emerald-600 font-bold text-xl">95 جنيه</span>
                    <button onclick="alert('تمت إضافة سمن جنة إلى السلة!')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">أضف للسلة</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
