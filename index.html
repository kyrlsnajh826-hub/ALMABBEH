<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عطارة المحبة والإيمان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background: #f8fafc; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- الهيدر -->
    <header class="bg-emerald-900 text-white shadow-lg sticky top-0 z-50 border-b border-emerald-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-800 p-2.5 rounded-2xl shadow-inner text-xl">🌿</div>
                <div>
                    <h1 class="text-lg sm:text-2xl font-black tracking-wide">عطارة المحبة والإيمان</h1>
                    <p class="text-xs text-emerald-300 font-medium">جودة أصلية وتوصيل لحد باب البيت</p>
                </div>
            </div>
            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="openAddModal()" class="bg-amber-500 hover:bg-amber-600 text-emerald-950 px-3 py-2 rounded-xl text-xs sm:text-sm font-black shadow transition">
                    ➕ إضافة منتج
                </button>
                <button onclick="toggleCart()" class="bg-emerald-700 hover:bg-emerald-600 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 shadow transition">
                    🛒 السلة (<span id="cart-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <!-- شريط البحث -->
        <div class="mb-8 flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <div>
                <h2 class="text-2xl font-black text-gray-800 mb-1">قائمة المنتجات المتاحة</h2>
                <p class="text-xs text-gray-400">ابحث واطلب بسهولة ليصلك الطلب فوراً عبر الواتساب</p>
            </div>
            <div class="relative w-full sm:w-80">
                <input type="text" id="searchBox" oninput="filterProducts()" placeholder="ابحث عن كمون، أرز، سمن..." class="bg-gray-50 border border-gray-200 px-4 py-3 rounded-2xl w-full text-sm focus:outline-none focus:border-emerald-600">
            </div>
        </div>

        <!-- شبكة المنتجات -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- المنتجات تظهر هنا -->
        </div>
    </main>

    <!-- نافذة إضافة منتج جديد -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="font-black text-lg text-emerald-900">➕ إضافة منتج جديد</h3>
                <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">اسم المنتج</label>
                    <input type="text" id="new-name" placeholder="مثال: كمون مطحون 250جم" class="w-full bg-gray-50 border p-2.5 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">السعر (بالجنيه)</label>
                    <input type="number" id="new-price" placeholder="مثال: 50" class="w-full bg-gray-50 border p-2.5 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">رابط الصورة (اختياري)</label>
                    <input type="text" id="new-img" placeholder="ضع رابط الصورة هنا" class="w-full bg-gray-50 border p-2.5 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                </div>
                <button onclick="addNewProduct()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold shadow transition">حفظ المنتج</button>
            </div>
        </div>
    </div>

    <!-- سلة المشتريات -->
    <div id="cart-overlay" onclick="toggleCart()" class="hidden fixed inset-0 bg-black/60 z-50"></div>
    <div id="cart-drawer" class="fixed top-0 left-0 h-full w-80 bg-white z-50 shadow-2xl p-6 flex flex-col -translate-x-full transition-transform duration-300">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h3 class="font-black text-xl text-emerald-900">🛒 سلة المشتريات</h3>
            <button onclick="toggleCart()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 font-bold">✕</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto space-y-3 mb-4 pr-1">
            <p class="text-center text-gray-400 py-16 text-sm">السلة فارغة حالياً</p>
        </div>
        <div class="border-t pt-4">
            <div class="flex justify-between items-center font-black text-lg mb-4 bg-emerald-50 p-4 rounded-2xl">
                <span>الإجمالي:</span>
                <span id="cart-total" class="text-emerald-700">0 ج.م</span>
            </div>
            <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-2xl font-bold shadow mb-2">📱 إرسال الطلب عبر واتساب</button>
            <button onclick="clearCart()" class="w-full bg-gray-100 text-gray-600 py-2 rounded-2xl font-bold text-xs">تفريغ السلة</button>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="bg-emerald-950 text-emerald-200 py-6 text-center text-xs mt-12">
        <p> جميع الحقوق محفوظة © عطارة المحبة والإيمان 2026</p>
    </footer>

    <script>
        // المنتجات المباشرة
        const initialProducts = [
            { id: 1, name: "كمون حصى فاخر", price: 65, img: "https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=500" },
            { id: 2, name: "أرز مصري رفيع 1كجم", price: 28, img: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500" },
            { id: 3, name: "سمن بلدي أصلي 1كجم", price: 220, img: "ghee.jpg.jpeg" },
            { id: 4, name: "زيت طعام ممتاز 1لتر", price: 75, img: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=500" },
            { id: 5, name: "كركديه أسواني فاخر", price: 120, img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=500" },
            { id: 6, name: "عدس مجروش 1كجم", price: 50, img: "https://images.unsplash.com/photo-1585998006296-9eb62f59d18f?w=500" }
        ];

        let products = JSON.parse(localStorage.getItem('mahabba_products')) || initialProducts;
        let cart = [];

        function displayProducts(items) {
            const grid = document.getElementById("product-grid");
            if (!items || items.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-16">لا توجد منتجات مطابقة لبحثك.</p>`;
                return;
            }

            grid.innerHTML = items.map(p => `
                <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-4 flex flex-col justify-between hover:shadow-xl transition duration-300">
                    <div>
                        <div class="overflow-hidden rounded-2xl mb-4 bg-gray-50 h-44">
                            <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500'">
                        </div>
                        <h3 class="font-black text-gray-800 text-base mb-2">${p.name}</h3>
                    </div>
                    <div class="pt-3 border-t border-gray-50 flex items-center justify-between">
                        <span class="text-emerald-700 font-black text-lg">${p.price} <span class="text-xs text-gray-500 font-normal">ج.م</span></span>
                        <button onclick="addToCart(${p.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow transition">🛒 أضف للسلة</button>
                    </div>
                </div>
            `).join("");
        }

        function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

        function addNewProduct() {
            const name = document.getElementById('new-name').value.trim();
            const price = parseFloat(document.getElementById('new-price').value);
            let img = document.getElementById('new-img').value.trim();

            if (!name || isNaN(price)) {
                alert("يرجى إدخال اسم المنتج والسعر بشكل صحيح!");
                return;
            }

            if (!img) {
                img = "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500";
            }

            const newProd = { id: Date.now(), name, price, img };
            products.push(newProd);
            localStorage.setItem('mahabba_products', JSON.stringify(products));
            displayProducts(products);
            closeAddModal();

            document.getElementById('new-name').value = '';
            document.getElementById('new-price').value = '';
            document.getElementById('new-img').value = '';
        }

        function filterProducts() {
            const query = document.getElementById("searchBox").value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filtered);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty++; } else { cart.push({ ...product, qty: 1 }); }
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            const container = document.getElementById("cart-items");
            const countEl = document.getElementById("cart-count");
            const totalEl = document.getElementById("cart-total");
            let totalCount = 0, totalPrice = 0;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-16 text-sm">السلة فارغة حالياً</p>`;
                countEl.innerText = "0"; totalEl.innerText = "0 ج.م";
                return;
            }

            container.innerHTML = cart.map((item, index) => {
                totalCount += item.qty;
                totalPrice += item.price * item.qty;
                return `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-2xl border text-sm">
                        <div>
                            <p class="font-bold text-gray-800">${item.name}</p>
                            <p class="text-xs text-emerald-700 font-bold">${item.price} ج × ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${index}, 1)" class="w-6 h-6 bg-white border rounded-lg font-bold">+</button>
                            <span>${item.qty}</span>
                            <button onclick="changeQty(${index}, -1)" class="w-6 h-6 bg-white border rounded-lg font-bold">-</button>
                        </div>
                    </div>
                `;
            }).join("");

            countEl.innerText = totalCount;
            totalEl.innerText = totalPrice + " ج.م";
        }

        function changeQty(index, amount) {
            cart[index].qty += amount;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            updateCartUI();
        }

        function clearCart() { cart = []; updateCartUI(); }
        function toggleCart() {
            document.getElementById("cart-drawer").classList.toggle("-translate-x-full");
            document.getElementById("cart-overlay").classList.toggle("hidden");
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) { alert("السلة فارغة!"); return; }
            let message = "🛒 *طلب جديد من متجر عطارة المحبة والإيمان:*\n\n";
            let total = 0;
            cart.forEach(item => {
                message += `▪️ ${item.name} (الكمية: ${item.qty}) = ${item.price * item.qty} ج.م\n`;
                total += item.price * item.qty;
            });
            message += `\n💰 *الإجمالي الكلي:* ${total} جنيه مصري`;
            window.open(`https://wa.me/201140950468?text=` + encodeURIComponent(message), '_blank');
        }

        displayProducts(products);
    </script>
</body>
</html>
