<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عطارة المحبة والإيمان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- الهيدر -->
    <header class="bg-emerald-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl sm:text-2xl font-black">🌿 عطارة المحبة والإيمان</h1>
                <p class="text-xs text-emerald-200">جودة عالية وأسعار منافسة</p>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleAdminPanel()" class="bg-amber-400 hover:bg-amber-500 text-amber-950 px-4 py-2 rounded-xl text-sm font-black shadow transition">
                    ⚙️ إدارة المتجر
                </button>
                
                <button onclick="openCart()" class="bg-emerald-700 hover:bg-emerald-600 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1 shadow">
                    🛒 السلة (<span id="cart-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- لوحة التحكم -->
    <div id="admin-panel" class="hidden max-w-7xl mx-auto px-4 mt-6 w-full">
        <div class="bg-white border-2 border-amber-400 rounded-2xl p-6 shadow-xl">
            <h3 class="text-lg font-black text-emerald-900 mb-4">🔐 لوحة تحكم المدير (إضافة وتعديل المنتجات)</h3>
            <form id="product-form" onsubmit="saveProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                <input type="text" id="p-name" placeholder="اسم المنتج" required class="bg-gray-50 border p-3 rounded-xl text-sm">
                <input type="number" id="p-price" placeholder="السعر بالجنيه" required class="bg-gray-50 border p-3 rounded-xl text-sm">
                <select id="p-cat" class="bg-gray-50 border p-3 rounded-xl text-sm">
                    <option>عطارة وبهارات</option>
                    <option>زيوت وسمن</option>
                    <option>حبوب وبقوليات</option>
                    <option>أرز ومكرونة</option>
                    <option>مشروبات</option>
                </select>
                <input type="file" id="p-img" accept="image/*" class="bg-gray-50 border p-2 rounded-xl text-xs">
                <div class="sm:col-span-full flex gap-2 pt-2">
                    <button type="submit" class="bg-emerald-600 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow">حفظ وعرض المنتج فوراً</button>
                    <button type="button" onclick="toggleAdminPanel()" class="bg-gray-200 text-gray-700 px-4 py-2.5 rounded-xl font-bold text-sm">إغلاق اللوحة</button>
                </div>
            </form>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h2 class="text-2xl font-black text-gray-800">قائمة المنتجات والعروض</h2>
            <input type="text" id="search" oninput="render()" placeholder="ابحث عن أي منتج..." class="bg-white border px-4 py-2 rounded-xl w-full sm:w-72 shadow-sm text-sm">
        </div>

        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- السلة الجانبية -->
    <div id="cart-overlay" onclick="closeCart()" class="hidden fixed inset-0 bg-black/50 z-50"></div>
    <div id="cart-drawer" class="fixed top-0 left-0 h-full w-80 bg-white z-50 shadow-2xl p-6 flex flex-col -translate-x-full transition-transform duration-300">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
            <h3 class="font-black text-lg text-emerald-900">🛒 سلة المشتريات</h3>
            <button onclick="closeCart()" class="font-bold text-gray-500 text-lg">✕</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto space-y-3 mb-4"></div>
        <div class="border-t pt-4">
            <div class="flex justify-between font-black text-lg mb-4">
                <span>الإجمالي:</span>
                <span id="cart-total" class="text-emerald-700">0 ج.م</span>
            </div>
            <button onclick="sendWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold shadow mb-2">📱 إرسال الطلب عبر واتساب</button>
            <button onclick="clearCart()" class="w-full bg-red-50 text-red-600 py-2 rounded-xl font-bold text-sm">تفريغ السلة</button>
        </div>
    </div>

    <script>
        let isAdmin = false;
        let products = JSON.parse(localStorage.getItem("store_prods")) || [
            { name: "زيت حلوة 3 لتر", price: 175, cat: "زيوت وسمن", img: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=500" },
            { name: "كمون حصى فاخر", price: 65, cat: "عطارة وبهارات", img: "https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=500" },
            { name: "أرز مصري 1كجم", price: 28, cat: "أرز ومكرونة", img: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500" },
            { name: "سمن بلدي 1كجم", price: 220, cat: "زيوت وسمن", img: "https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?w=500" }
        ];
        let cart = JSON.parse(localStorage.getItem("store_cart")) || [];

        function toggleAdminPanel() {
            if (!isAdmin) {
                let pass = prompt("أدخل الرقم السري للإدارة:");
                if (pass === "Almabbeh@2026#Admin") {
                    isAdmin = true;
                    document.getElementById("admin-panel").classList.remove("hidden");
                    render();
                } else if (pass !== null) {
                    alert("الرقم السري غير صحيح!");
                }
            } else {
                isAdmin = false;
                document.getElementById("admin-panel").classList.add("hidden");
                render();
            }
        }

        function render() {
            let search = document.getElementById("search").value.toLowerCase();
            let grid = document.getElementById("grid");
            let filtered = products.filter(p => p.name.toLowerCase().includes(search));

            if (!filtered.length) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-10">لا توجد منتجات مطابقة</p>`;
                return;
            }

            grid.innerHTML = filtered.map((p, idx) => `
                <div class="bg-white rounded-2xl shadow-sm border p-4 flex flex-col justify-between">
                    <div>
                        <img src="${p.img}" class="w-full h-40 object-cover rounded-xl mb-3" onerror="this.src='https://via.placeholder.com/300'">
                        <span class="bg-emerald-50 text-emerald-800 text-xs px-2 py-1 rounded-md font-bold">${p.cat}</span>
                        <h4 class="font-black text-gray-900 mt-2">${p.name}</h4>
                    </div>
                    <div class="mt-4">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-emerald-700 font-black text-lg">${p.price} ج.م</span>
                            <button onclick="addToCart(${idx})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow">🛒 أضف</button>
                        </div>
                        ${isAdmin ? `
                        <div class="flex gap-1 border-t pt-2">
                            <button onclick="deleteProduct(${idx})" class="w-full bg-red-50 text-red-600 py-1 rounded-lg text-xs font-bold">🗑️ حذف</button>
                        </div>` : ''}
                    </div>
                </div>
            `).join("");
        }

        function saveProduct(e) {
            e.preventDefault();
            let name = document.getElementById("p-name").value;
            let price = Number(document.getElementById("p-price").value);
            let cat = document.getElementById("p-cat").value;
            let fileInput = document.getElementById("p-img").files[0];

            let proceed = (imgUrl) => {
                products.push({ name, price, cat, img: imgUrl || "https://via.placeholder.com/300" });
                localStorage.setItem("store_prods", JSON.stringify(products));
                document.getElementById("product-form").reset();
                render();
                alert("تم إضافة المنتج وعرضه فوراً بنجاح!");
            };

            if (fileInput) {
                let reader = new FileReader();
                reader.onload = function(evt) { proceed(evt.target.result); };
                reader.readAsDataURL(fileInput);
            } else {
                proceed();
            }
        }

        function deleteProduct(idx) {
            if (confirm("هل تريد حذف هذا المنتج؟")) {
                products.splice(idx, 1);
                localStorage.setItem("store_prods", JSON.stringify(products));
                render();
            }
        }

        function addToCart(idx) {
            let p = products[idx];
            let item = cart.find(i => i.name === p.name);
            if (item) item.qty++;
            else cart.push({ name: p.name, price: p.price, qty: 1 });
            saveCart();
            openCart();
        }

        function changeQty(idx, val) {
            cart[idx].qty += val;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            saveCart();
        }

        function saveCart() {
            localStorage.setItem("store_cart", JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            let container = document.getElementById("cart-items");
            let totalEl = document.getElementById("cart-total");
            let countEl = document.getElementById("cart-count");
            let total = 0, totalQty = 0;

            if (!cart.length) {
                container.innerHTML = `<p class="text-center text-gray-400 py-10">السلة فارغة</p>`;
                totalEl.innerText = "0 ج.م";
                countEl.innerText = "0";
                return;
            }

            container.innerHTML = cart.map((item, idx) => {
                total += item.price * item.qty;
                totalQty += item.qty;
                return `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border text-sm">
                    <div>
                        <p class="font-bold">${item.name}</p>
                        <p class="text-xs text-emerald-700">${item.price} ج × ${item.qty}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty(${idx}, 1)" class="bg-white border px-2 py-0.5 rounded font-bold">+</button>
                        <span>${item.qty}</span>
                        <button onclick="changeQty(${idx}, -1)" class="bg-white border px-2 py-0.5 rounded font-bold">-</button>
                    </div>
                </div>`;
            }).join("");

            totalEl.innerText = total + " ج.م";
            countEl.innerText = totalQty;
        }

        function openCart() {
            document.getElementById("cart-drawer").classList.remove("-translate-x-full");
            document.getElementById("cart-overlay").classList.remove("hidden");
            renderCart();
        }

        function closeCart() {
            document.getElementById("cart-drawer").classList.add("-translate-x-full");
            document.getElementById("cart-overlay").classList.add("hidden");
        }

        function clearCart() {
            cart = [];
            saveCart();
        }

        function sendWhatsApp() {
            if (!cart.length) {
                alert("السلة فارغة!");
                return;
            }
            let msg = "🛒 *طلب جديد من المتجر:*\n\n";
            let total = 0;
            cart.forEach(i => {
                msg += `- ${i.name} (الكمية: ${i.qty}) = ${i.price * i.qty} ج\n`;
                total += i.price * i.qty;
            });
            msg += `\n💰 *الإجمالي الكلي:* ${total} جنيه`;
            window.open(`https://wa.me/201140950468?text=` + encodeURIComponent(msg), '_blank');
        }

        render();
        renderCart();
    </script>
</body>
</html>
