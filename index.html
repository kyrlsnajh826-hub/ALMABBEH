<style>
:root{--g:#1f6b3a;--gd:#14482a;--gold:#e0a82e;--bg:#f6f8f5;--tx:#17301f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;padding-bottom:100px}
header{background:linear-gradient(160deg,var(--gd),var(--g));color:#fff;padding:20px 16px 56px;text-align:center}
h1{margin:0;font-size:24px}header p{margin:4px 0 0;opacity:.85;font-size:14px}
.sb{position:sticky;top:0;z-index:6;padding:0 14px 8px;margin-top:-30px}
.sb input{width:100%;border:0;border-radius:26px;padding:14px 20px;font:inherit;font-size:16px;background:#fff;box-shadow:0 3px 12px rgba(20,72,42,.18)}
section{margin:14px;background:#fff;border-radius:22px;padding:14px}
h2{margin:0 0 10px;font-size:18px}
.cats,.offs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.cat{flex:0 0 auto;border:0;background:#eef3ec;border-radius:24px;padding:9px 16px;font:inherit;cursor:pointer;color:var(--tx)}.cat.on{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.offs .p{flex:0 0 160px}
.p{position:relative;background:#fff;border-radius:18px;padding:9px;box-shadow:0 2px 9px rgba(20,72,42,.12);display:flex;flex-direction:column}
.pic{position:relative;height:115px;border-radius:12px;background:#eef3ec;display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.p h3{font-size:14px;margin:8px 0 4px}
.units{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0}
.u{border:1px solid #cfd9cc;background:#fff;border-radius:12px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer;color:var(--tx)}.u.on{background:var(--g);color:#fff;border-color:var(--g)}
.qty{font-size:12px;color:var(--g);min-height:16px}
.price{font-weight:bold;font-size:16px;margin-top:auto;padding-top:4px}.price s{color:#9aa39c;font-size:12px;font-weight:normal}
.add{position:absolute;left:9px;top:82px;width:38px;height:38px;border-radius:50%;border:0;background:var(--gd);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.tag{position:absolute;top:6px;right:6px;background:#c0392b;color:#fff;font-size:12px;font-weight:bold;padding:2px 9px;border-radius:10px}
.off{position:absolute;top:6px;left:6px;background:var(--gold);color:#3a2a00;font-size:12px;font-weight:bold;padding:2px 8px;border-radius:10px}
.p.out .pic img,.p.out .pic{opacity:.5}
.adm{display:flex;gap:4px;margin-top:6px}.adm button{flex:1;border:0;border-radius:10px;padding:7px 0;font:inherit;font-size:12px;cursor:pointer;background:#eef3ec}
.empty{grid-column:1/-1;text-align:center;padding:24px;color:#7a857c}
.bar{position:fixed;left:12px;right:12px;bottom:12px;background:#25D366;color:#fff;border:0;border-radius:30px;padding:16px;font:inherit;font-size:17px;font-weight:bold;display:none;justify-content:space-between;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer;z-index:5}.bar.show{display:flex}
.fab{position:fixed;left:14px;bottom:80px;width:52px;height:52px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:4}
.newp{position:fixed;right:14px;bottom:80px;background:var(--gold);color:#3a2a00;border:0;border-radius:26px;padding:13px 18px;font:inherit;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:4;display:none;cursor:pointer}
footer{text-align:center;padding:10px}footer button{border:0;background:none;color:#8a948c;font:inherit;font-size:13px;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}.sheet.show{display:flex}
.box{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}
.box input,.box select,.box textarea{width:100%;margin:5px 0;border:1px solid #cfd9cc;border-radius:12px;padding:12px;font:inherit;font-size:16px}
.box label{font-size:13px;color:#566}
.box .chk{display:flex;align-items:center;gap:8px;margin:8px 0}.box .chk input{width:auto}
.ln{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eef3ec;font-size:15px}
.ln .q{display:flex;align-items:center;gap:8px}.ln .q button{width:30px;height:30px;border-radius:50%;border:0;background:#eef3ec;font-size:18px;cursor:pointer}
.sm{padding:10px 0;font-size:15px;line-height:1.9}.sm b{font-size:18px}
.send{width:100%;margin-top:8px;border:0;border-radius:26px;padding:15px;background:#25D366;color:#fff;font:inherit;font-size:17px;font-weight:bold;cursor:pointer}
.send.dk{background:var(--g)}
.close{width:100%;margin-top:6px;border:0;background:none;padding:10px;font:inherit;color:var(--g);cursor:pointer}
</style>
