<title>عطارة المحبة والإيمان</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style id="app-style">
/* Layout: deep-teal masthead with calligraphic shop name, search and category chips, two-column shelf with shelf-label prices,
   fixed order bar, bottom-sheet cart, and an owner-only management sheet.
   Tokens: teal band, amber-brown accent for prices and actions, green-tinted neutrals. Fonts: Aref Ruqaa display, Almarai body. */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --fg: #14231f;
  --muted: #566a62;
  --line: #d3ddd6;
  --accent: #8f5200;
  --accent-fg: #ffffff;
  --band: #12443d;
  --band-fg: #f3f1e8;
  --tile-fg: #14231f;
  --c-spice: #efcf9a;
  --c-herb: #cfe2c1;
  --c-honey: #f2dc84;
  --c-seed: #e2d0bb;
  --c-oil: #dbe6a9;
  --danger: #a3262a;
  --overlay: rgba(8, 20, 17, 0.55);
  --f-display: 'Aref Ruqaa', 'Almarai', 'Tahoma', serif;
  --f-body: 'Almarai', 'Tahoma', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1816;
    --surface: #162420;
    --fg: #e6efe9;
    --muted: #9db4aa;
    --line: #2a3e38;
    --accent: #f2b552;
    --accent-fg: #261700;
    --band: #0d2f2a;
    --band-fg: #e6efe9;
    --tile-fg: #e6efe9;
    --c-spice: #4a3a1c;
    --c-herb: #22381f;
    --c-honey: #4a3f14;
    --c-seed: #3d3024;
    --c-oil: #38401c;
    --danger: #ff8a8d;
    --overlay: rgba(0, 0, 0, 0.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1816;
  --surface: #162420;
  --fg: #e6efe9;
  --muted: #9db4aa;
  --line: #2a3e38;
  --accent: #f2b552;
  --accent-fg: #261700;
  --band: #0d2f2a;
  --band-fg: #e6efe9;
  --tile-fg: #e6efe9;
  --c-spice: #4a3a1c;
  --c-herb: #22381f;
  --c-honey: #4a3f14;
  --c-seed: #3d3024;
  --c-oil: #38401c;
  --danger: #ff8a8d;
  --overlay: rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.inner {
  max-width: 880px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* masthead */
.band { background: var(--band); color: var(--band-fg); }
.band .inner { padding-block: 18px 22px; }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.kicker { font-size: 13px; letter-spacing: 0.04em; opacity: 0.85; }
.adm {
  min-height: 36px;
  padding: 0 14px;
  border: 1.5px solid currentColor;
  border-radius: 8px;
  background: transparent;
  color: var(--band-fg);
  font-weight: 700;
}
.brand {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(38px, 10.5vw, 62px);
  line-height: 1.3;
  margin: 6px 0 4px;
  text-wrap: balance;
}
.lede { margin: 0; max-width: 34em; opacity: 0.94; }
.contact { margin: 12px 0 0; font-size: 14px; display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; }
.contact bdi { font-weight: 800; letter-spacing: 0.04em; user-select: all; }
.contact a { color: var(--band-fg); font-weight: 800; }

/* controls */
.controls { display: grid; gap: 12px; padding-block: 18px 6px; }
.search {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.search::placeholder { color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 7px 14px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: 14px;
}
.chip[aria-pressed="true"] {
  background: var(--band);
  border-color: var(--band);
  color: var(--band-fg);
  font-weight: 700;
}

/* shelf */
.shelf {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
  padding-block: 12px 28px;
}
.card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.tile {
  display: grid;
  place-items: center;
  height: 104px;
  padding: 8px;
  color: var(--tile-fg);
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 30px;
  line-height: 1.2;
  text-align: center;
}
.tile.has-img { padding: 0; }
.tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
.cat-spice { background: var(--c-spice); }
.cat-herb { background: var(--c-herb); }
.cat-honey { background: var(--c-honey); }
.cat-seed { background: var(--c-seed); }
.cat-oil { background: var(--c-oil); }
.card-body { display: flex; flex-direction: column; gap: 10px; flex: 1; padding: 10px; min-width: 0; }
.name { margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
.unit { margin: -6px 0 0; color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; flex-wrap: wrap; }
.price {
  font-weight: 800;
  color: var(--accent);
  border: 1.5px dashed var(--accent);
  border-radius: 6px;
  padding: 2px 8px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.add, .solid {
  min-height: 40px;
  padding: 0 16px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-fg);
  font-weight: 800;
}
.step {
  display: inline-flex;
  align-items: center;
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  overflow: hidden;
}
.step button {
  width: 40px;
  height: 40px;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 20px;
  font-weight: 800;
}
.step output { min-width: 28px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.empty { grid-column: 1 / -1; padding: 28px 0; color: var(--muted); text-align: center; }
.note { color: var(--muted); font-size: 13px; padding-block: 0 28px; margin: 0; }

/* order bar */
.bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-top: 10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 880px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar-sum { min-width: 0; line-height: 1.3; }
.bar-sum strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.bar-sum span { color: var(--muted); font-size: 13px; }
.go { min-height: 46px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-weight: 800; white-space: nowrap; }

/* sheets */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: var(--overlay);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  width: 100%;
  max-width: 560px;
  max-height: 88%;
  overflow-y: auto;
  background: var(--bg);
  border-radius: 16px 16px 0 0;
  padding-top: 16px;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet.wide { max-width: 640px; max-height: 94%; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-size: 28px; font-weight: 700; }
.close { width: 40px; height: 40px; border: 1.5px solid var(--line); border-radius: 50%; background: var(--surface); font-size: 18px; }
.lines { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 8px; }
.line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 10px;
  padding: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.line .t { min-width: 0; line-height: 1.35; }
.line .t b { display: block; overflow-wrap: anywhere; }
.line .t small { color: var(--muted); }
.line .amt { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 64px; text-align: left; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 2px 14px; font-size: 18px; font-weight: 800; }
.total span:last-child { color: var(--accent); font-variant-numeric: tabular-nums; }
.form { display: grid; gap: 10px; }
.form label, .fld { display: grid; gap: 4px; font-weight: 700; font-size: 14px; }
.form input, .form textarea, .form select, .fld input {
  width: 100%;
  padding: 11px 12px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  font-weight: 400;
}
.form textarea { resize: vertical; min-height: 64px; }
.actions { display: grid; gap: 10px; margin-top: 14px; }
.wa {
  display: grid;
  place-items: center;
  min-height: 48px;
  border-radius: 10px;
  background: var(--accent);
  color: var(--accent-fg);
  font-weight: 800;
  text-decoration: none;
}
.wa[aria-disabled="true"] { opacity: 0.5; }
.ghost { min-height: 44px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 700; }
.status { min-height: 1.4em; margin: 0; color: var(--muted); font-size: 13px; }
.copybox { width: 100%; min-height: 120px; margin-top: 4px; padding: 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); }

/* management */
.adm-hint { margin: 10px 0 14px; padding: 10px 12px; border: 1px dashed var(--accent); border-radius: 10px; color: var(--fg); font-size: 14px; }
.adm-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0 8px; }
.adm-row h3 { margin: 0; font-size: 17px; }
.alist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.arow {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
  padding: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.arow.is-off { opacity: 0.7; }
.arow .at { min-width: 0; line-height: 1.4; }
.arow .at b { display: block; overflow-wrap: anywhere; }
.arow .at small { color: var(--muted); }
.ab { display: flex; gap: 8px; flex-wrap: wrap; }
.sm { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 8px; }
.ab .sm { border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; }
.ab .sm.warn { border-color: var(--danger); color: var(--danger); }
.adm-foot { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); margin-top: 16px; padding-block: 12px 4px; background: var(--bg); display: grid; gap: 6px; }
.adm-foot .solid { min-height: 48px; }
.adm-foot .solid:disabled { opacity: 0.45; cursor: default; }
.img-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.thumb { width: 96px; height: 96px; border-radius: 10px; border: 1px solid var(--line); object-fit: cover; background: var(--surface); }
.thumb-empty { display: grid; place-items: center; width: 96px; height: 96px; border-radius: 10px; border: 1.5px dashed var(--line); color: var(--muted); font-size: 13px; text-align: center; padding: 6px; }
.filebtn { display: inline-grid; place-items: center; cursor: pointer; }
.err { color: var(--danger); font-size: 13px; min-height: 1.4em; margin: 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

    var saved = JSON.parse(localStorage.getItem("attar-cart") || "{}");
    Object.keys(saved).forEach(function (k) {
      if (BY_ID[k] && !BY_ID[k].off && saved[k] > 0) cart[k] = saved[k];
    });
  } catch (e) {}
  function persist() { try { localStorage.setItem("attar-cart", JSON.stringify(cart)); } catch (e) {} }

  var cat = "all", query = "";
  var shelf = $("shelf"), chips = $("chips"), bar = $("bar"), overlay = $("overlay");

  function stepper(id) {
    var q = cart[id] || 0;
    if (!q) return '<button class="add" type="button" data-act="inc" data-id="' + esc(id) + '">أضف</button>';
    return '<div class="step" role="group" aria-label="الكمية">' +
      '<button type="button" data-act="dec" data-id="' + esc(id) + '" aria-label="تقليل الكمية">−</button>' +
      '<output>' + fmt(q) + '</output>' +
      '<button type="button" data-act="inc" data-id="' + esc(id) + '" aria-label="زيادة الكمية">+</button></div>';
  }
