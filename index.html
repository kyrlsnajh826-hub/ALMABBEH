<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المبه - ALMABBEH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-emerald-600 text-white shadow-md py-4 px-6 mb-8">
        <div class="container mx-auto flex justify-between items-center">
            <!-- اضغط مرتين هنا عشان تفتح وضع الإدارة -->
            <h1 id="main-title" ondblclick="enableAdminMode()" class="text-2xl font-bold cursor-pointer select-none" title="اضغط مرتين هنا كمدير للمتجر">🛒 متجر المبه (ALMABBEH)</h1>
            <span id="admin-badge" class="hidden bg-amber-500 text-white text-xs px-3 py-1 rounded-full font-bold">وضع المدير (مفعل)</span>
        </div>
    </header>

    <main class="container mx-auto px-4 pb-12">
        
        <!-- لوحة التحكم للإدارة (مخفية تماماً عن الزباين ولا تظهر إلا لك) -->
        <div id="admin-panel" class="hidden bg-white p-6 rounded-2xl shadow-lg mb-10 border border-emerald-100">
            <div class="flex justify-between items-center mb-4">
                <h3 id="form-title" class="text-xl font-bold text-emerald-700">➕ إضافة منتج جديد</h3>
                <button onclick="logoutAdmin()" class="text-red-500 text-sm hover:underline font-semibold">خروج من وضع الإدارة 🔒</button>
            </div>
            <form id="product-form" onsubmit="saveProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <input type="hidden" id="product-index" value="">
                <div>
                    <label class="block text-sm font-semibold mb-1">اسم المنتج</label>
                    <input type="text" id="p-name" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-emerald-600" placeholder="مثال: أرز مصري">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">السعر (بالجنيه)</label>
                    <input type="number" id="p-price" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-emerald-600" placeholder="مثال: 25">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">القسم</label>
                    <input type="text" id="p-category" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-emerald-600" placeholder="مثال: حبوب">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">رابط الصورة</label>
                    <input type="url" id="p-image" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-emerald-600" placeholder="رابط صورة المنتج">
                </div>
                <div class="sm:col-span-full flex gap-3 mt-2">
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg font-semibold">حفظ المنتج</button>
                    <button type="button" onclick="resetForm()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-lg font-semibold">إلغاء</button>
                </div>
            </form>
        </div>

        <h2 class="text-xl font-semibold mb-6 text-gray-700">قائمة المنتجات المعروضة:</h2>
        
        <!-- شبكة عرض المنتجات -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <script>
        let isAdmin = false;

        let products = JSON.parse(localStorage.getItem('almabbeh_products')) || [
            { name: "أرز", price: 25, category: "حبوب", image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=500&q=80" },
            { name: "زيت حلو 1 بروف", price: 45, category: "زيوت", image: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=500&q=80" },
            { name: "مكرونة", price: 15, category: "نشويات", image: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=500&q=80" },
            { name: "شاي العروسة 250 جم", price: 35, category: "مشروبات", image: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=500&q=80" },
            { name: "سمن جنة 1.5 كج", price: 95, category: "دهون ولبنيات", image: "https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?auto=format&fit=crop&w=500&q=80" }
        ];

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            if (products.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10">لا توجد منتجات مضافة حالياً.</p>';
                return;
            }

            grid.innerHTML = products.map((p, index) => `
                <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col justify-between">
                    <div>
                        <div class="w-full h-48 bg-gray-200">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover">
                        </div>
                        <div class="p-4">
                            <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">${p.category}</span>
                            <h3 class="text-lg font-bold mt-2 text-gray-800">${p.name}</h3>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-emerald-600 font-bold text-xl">${p.price} جنيه</span>
                            <button onclick="alert('تمت إضافة ${p.name} إلى السلة!')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">أضف للسلة</button>
                        </div>
                        <!-- أزرار التعديل والحذف تظهر لك وحدك فقط لو كنت مسجل دخول كمدير -->
                        ${isAdmin ? `
                            <div class="flex gap-2 border-t pt-2 mt-2">
                                <button onclick="editProduct(${index})" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-600 py-1 rounded text-xs font-semibold">✏️ تعديل</button>
                                <button onclick="deleteProduct(${index})" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 py-1 rounded text-xs font-semibold">🗑️ حذف</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function enableAdminMode() {
            const pass = prompt("أدخل كلمة مرور المدير:");
            if (pass === "123") { // كلمة السر الافتراضية تقدر تغيرها براحتك
                isAdmin = true;
                document.getElementById('admin-badge').classList.remove('hidden');
                renderProducts();
                alert("تم تفعيل وضع المدير بنجاح!");
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('admin-badge').classList.add('hidden');
            renderProducts();
        }

        function saveProduct(e) {
            e.preventDefault();
            const index = document.getElementById('product-index').value;
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const category = document.getElementById('p-category').value;
            const image = document.getElementById('p-image').value;

            const productData = { name, price: Number(price), category, image };

            if (index === "") {
                products.push(productData);
            } else {
                products[index] = productData;
            }

            localStorage.setItem('almabbeh_products', JSON.stringify(products));
            resetForm();
            renderProducts();
        }

        function editProduct(index) {
            const p = products[index];
            document.getElementById('product-index').value = index;
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-category').value = p.category;
            document.getElementById('p-image').value = p.image;
            document.getElementById('form-title').innerText = "✏️ تعديل المنتج: " + p.name;
            
            document.getElementById('admin-panel').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProduct(index) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                products.splice(index, 1);
                localStorage.setItem('almabbeh_products', JSON.stringify(products));
                renderProducts();
            }
        }

        function resetForm() {
            document.getElementById('product-form').reset();
            document.getElementById('product-index').value = "";
            document.getElementById('form-title').innerText = "➕ إضافة منتج جديد";
            document.getElementById('admin-panel').classList.add('hidden');
        }

        renderProducts();
    </script>
</body>
</html>
