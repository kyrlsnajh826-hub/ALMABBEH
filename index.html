<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عطارة المحبة والإيمان</title>
<style>
:root{--g:#1f6b3a;--gd:#14482a;--gold:#e0a82e;--bg:#f6f8f5;--tx:#17301f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;padding-bottom:90px}
header{background:var(--g);color:#fff;padding:18px 16px 70px;text-align:center;position:relative}
header h1{margin:0 0 4px;font-size:24px}
header p{margin:0;opacity:.85;font-size:14px}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:44px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.banner{margin:-46px 14px 0;position:relative;z-index:2;border-radius:22px;background:linear-gradient(120deg,var(--gd),var(--g));color:#fff;padding:22px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 18px rgba(20,72,42,.25)}
.banner b{display:block;font-size:26px;color:var(--gold);margin-bottom:6px}
.banner span{font-size:14px}
.banner i{font-size:56px;font-style:normal}
section{margin:22px 14px 0;background:#fff;border-radius:26px;padding:16px}
h2{margin:0 0 12px;font-size:20px}
.cats{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.cat{flex:0 0 auto;border:0;background:#eef3ec;border-radius:30px;padding:10px 18px;font:inherit;font-size:15px;cursor:pointer;color:var(--tx)}
.cat.on{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.p{background:#fafcf9;border-radius:20px;padding:10px;position:relative;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(20,72,42,.08)}
.pic{height:120px;border-radius:14px;background:#eef3ec;display:flex;align-items:center;justify-content:center;font-size:56px;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.p h3{font-size:15px;margin:10px 0 4px}
.price{font-weight:bold;font-size:17px;margin-top:auto;padding-top:6px}
.price small{font-weight:normal;font-size:12px}
.price s{color:#9aa39c;font-size:13px;font-weight:normal}
.add{position:absolute;left:10px;top:88px;width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;font-size:24px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.add:active{transform:scale(.9)}
.units{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0}
.u{border:1px solid #cfd9cc;background:#fff;border-radius:14px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer;color:var(--tx)}
.u.on{background:var(--g);color:#fff;border-color:var(--g)}
.bar{position:fixed;left:12px;right:12px;bottom:12px;background:#25D366;color:#fff;border:0;border-radius:30px;padding:16px;font:inherit;font-size:17px;font-weight:bold;display:none;justify-content:space-between;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer;z-index:5}
.bar.show{display:flex}
.fab{position:fixed;left:14px;bottom:80px;width:54px;height:54px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:4}
.sb{position:sticky;top:0;z-index:6;padding:12px 14px 6px;background:linear-gradient(var(--bg) 75%,transparent)}
.sb input{width:100%;border:0;border-radius:26px;padding:14px 20px;font:inherit;font-size:16px;background:#fff;box-shadow:0 3px 12px rgba(20,72,42,.15)}
header{background:linear-gradient(160deg,var(--gd),var(--g))}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
.sheet.show{display:flex}
.box{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px}
.box input{width:100%;margin:6px 0;border:1px solid #cfd9cc;border-radius:14px;padding:13px;font:inherit;font-size:16px}
.ln{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eef3ec;font-size:15px}
.ln .q{display:flex;align-items:center;gap:8px}
.ln .q button{width:30px;height:30px;border-radius:50%;border:0;background:#eef3ec;font-size:18px;cursor:pointer}
.sm{padding:10px 0;font-size:15px;line-height:1.9}
.sm b{font-size:18px}
.send{width:100%;margin-top:8px;border:0;border-radius:26px;padding:15px;background:#25D366;color:#fff;font:inherit;font-size:17px;font-weight:bold;cursor:pointer}
.close{width:100%;margin-top:6px;border:0;background:none;padding:10px;font:inherit;color:var(--g);cursor:pointer}
</style>
</head>
<body>
<header><h1>عطارة المحبة والإيمان</h1><p>أهلاً بكم في متجرنا</p></header>
<div class="banner"><div><b>عالم العطارة</b><span>اختار منتجاتك واطلب على واتساب</span></div><i>🌿</i></div>

<div class="sb"><input id="q" type="search" placeholder="🔍 دوّر على منتج..." oninput="q=this.value.trim();draw()"></div>
<section id="offsec" style="display:none"><h2>🔥 العروض</h2><div class="offs" id="offs"></div></section>
<section><h2>الأقسام</h2><div class="cats" id="cats"></div></section>
<section><h2 id="title">كل المنتجات</h2><div class="grid" id="grid"></div></section>

<a class="fab" href="https://wa.me/201140950468" target="_blank" aria-label="واتساب">💬</a>
<button class="bar" id="bar" onclick="openCart()"><span id="count">0 منتجات</span><span>إرسال الطلب على واتساب</span></button>

<div class="sheet" id="sheet">
  <div class="box">
    <h2>طلبك</h2>
    <div id="cl"></div>
    <div class="sm" id="sm"></div>
    <input id="nm" placeholder="الاسم">
    <input id="ad" placeholder="العنوان بالتفصيل">
    <input id="nt" placeholder="ملاحظات (اختياري)">
    <button class="send" onclick="send()">إرسال الطلب على واتساب</button>
    <button class="close" onclick="closeCart()">رجوع للمنتجات</button>
  </div>
</div>

<script>
var PHONE="201140950468";
var cart = {};
var currentCat = "الكل";
var q = "";

var P=[
  {n:"أرز حبوبه",p:150,c:"الأساسيات",e:"🍚"},{n:"أرز حبوبه",p:150,c:"الأساسيات",img:"صورة الأرز.jpg"},
  {n:"سكر",p:35,c:"الأساسيات",e:"🧂"},
  {n:"زيت حلوة 1 لتر",old:90,p:80,c:"الأساسيات",e:"🛢️"},
  {n:"زيت حلوة عبوة كبيرة",p:285,c:"الأساسيات",e:"🛢️"},
  {n:"أرز التمساح",p:25,c:"الأساسيات",e:"🍚",u:[["كيلو",25],["شيكارة 25 كجم",600]]},
  {n:"أرز التمساح 10 كجم",p:215,c:"الأساسيات",e:"🍚"},
  {n:"زيت خليط 700 مل",p:55,c:"الأساسيات",e:"🛢️"},
  {n:"سمن جنة 1.5 كيلو",p:180,c:"الأساسيات",e:"🧈"},
  {n:"مكرونة حواء",p:15,c:"الأساسيات",e:"🍝",u:[["كيس",15],["كرتون",180]]},
  {n:"مكرونة",p:24,c:"الأساسيات",e:"🍝",u:[["كيلو",24],["شيكارة",250]]},
  {n:"دقيق",p:30,c:"الأساسيات",e:"🌾"},
  {n:"شاي العروسة 250 جم",p:60,c:"الأساسيات",e:"🍵"},
  {n:"ملح",p:10,c:"الأساسيات",e:"🧂"},
  {n:"عدس",p:60
,c:"الأساسيات",e:"🥣"},
  {n:"فول",p:55,c:"الأساسيات",e:"🫘"},
  {n:"لبن بودرة بخيرة",old:25,p:22,c:"مشروبات وألبان",e:"🥛",u:[["كيس",22],["نص كرتون",550]]},
  {n:"قهوة بونجورنو كوفي ميكس",p:70,c:"مشروبات وألبان",e:"☕"},
  {n:"قهوة كوفي بريك 2×1",p:65,c:"مشروبات وألبان",e:"☕"}
];
  

function init() {
  var categories = ["الكل"];
  P.forEach(function(item) {
    if(!categories.includes(item.c)) categories.push(item.c);
  });
  
  var catsHtml = "";
  categories.forEach(function(cat) {
    catsHtml += `<button class="cat ${cat==='الكل'?'on':''}" onclick="setCat('${cat}', this)">${cat}</button>`;
  });
  document.getElementById("cats").innerHTML = catsHtml;
  draw();
}

function setCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll(".cat").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  draw();
}

function draw() {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  
  var filtered = P.filter(function(item) {
    var matchCat = (currentCat === "الكل" || item.c === currentCat);
    var matchQ = (q === "" || item.n.includes(q));
    return matchCat && matchQ;
  });
  
  if(filtered.length === 0) {
    grid.innerHTML = '<div class="empty">لا توجد منتجات مطابقة</div>';
    return;
  }
  
  filtered.forEach(function(item, index) {
    var priceHtml = item.old ? `<s>${item.old} ج.م</s> ${item.p} ج.م` : `${item.p} ج.م`;
    var card = `
      <div class="p">
        <div class="pic">${item.e}</div>
        <button class="add" onclick="addToCart('${item.n}', ${item.p})">+</button>
        <h3>${item.n}</h3>
        <div class="price">${priceHtml}</div>
      </div>
    `;
    grid.innerHTML += card;
  });
}

function addToCart(name, price) {
  if(cart[name]) {
    cart[name].qty += 1;
  } else {
    cart[name] = {price: price, qty: 1};
  }
  updateBar();
}

function updateBar() {
  var totalQty = 0;
  for(var key in cart) {
    totalQty += cart[key].qty;
  }
  var bar = document.getElementById("bar");
  if(totalQty > 0) {
    bar.classList.add("show");
    document.getElementById("count").innerText = totalQty + " منتجات";
  } else {
    bar.classList.remove("show");
  }
}

function openCart() {
  var cl = document.getElementById("cl");
  cl.innerHTML = "";
  var total = 0;
  for(var key in cart) {
    var item = cart[key];
    var subtotal = item.price * item.qty;
    total += subtotal;
    cl.innerHTML += `
      <div class="ln">
        <span>${key} (${item.price} ج.م)</span>
        <div class="q">
          <button onclick="changeQty('${key}', -1)">-</button>
          <span>${item.qty}</span>
          <button onclick="changeQty('${key}', 1)">+</button>
        </div>
      </div>
    `;
  }
  document.getElementById("sm").innerHTML = `<b>الإجمالي: ${total} ج.م</b>`;
  document.getElementById("sheet").classList.add("show");
}

function changeQty(name, delta) {
  if(cart[name]) {
    cart[name].qty += delta;
    if(cart[name].qty <= 0) delete cart[name];
  }
  updateBar();
  openCart();
}

function closeCart() {
  document.getElementById("sheet").classList.remove("show");
}

function send() {
  var name = document.getElementById("nm").value.trim();
  var address = document.getElementById("ad").value.trim();
  var notes = document.getElementById("nt").value.trim();
  
  if(!name || !address) {
    alert("يرجى إدخال الاسم والعنوان");
    return;
  }
  
  var text = `طلب جديد من: ${name}\nالعنوان: ${address}\n`;
  if(notes) text += `ملاحظات: ${notes}\n`;
  text += `\nالمنتجات:\n`;
  
  var total = 0;
  for(var key in cart) {
    var subtotal = cart[key].price * cart[key].qty;
    total += subtotal;
    text += `- ${key} × ${cart[key].qty} = ${subtotal} ج.م\n`;
  }
  text += `\nالإجمالي: ${total} ج.م`;
  
  var url = `https://wa.me/${PHONE}?text=${encodeURIComponent(text)}`;
  window.open(url, "_blank");
}

window.onload = init;
</script>
</body>
</html>
